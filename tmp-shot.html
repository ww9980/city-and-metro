<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden}iframe{border:0;width:1500px;height:1050px}</style></head>
<body><iframe id="f" src="index.html"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', function () {
  const w = f.contentWindow;
  try {
    if (w.CM && w.CM.newGame) {
      w.CM.newGame({ map: 'ta', mode: 'free' });
      setTimeout(function () {
        try { w.CM.game.setSpeed(0); w.CM.game.clock.y = 2000; w.CM.game.clock.m = 1; } catch (e) {}
        try { w.CM.R.cam.zoom = 14; w.CM.R.cam.tz = 14; w.CM.R.cam.cx = 32; w.CM.R.cam.cy = 30; } catch (e) {}
      }, 3000);
    }
  } catch (e) { document.title = 'ERR ' + e.message; }
});
</script></body></html>
